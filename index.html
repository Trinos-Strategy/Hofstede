<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare cultural dimensions across 42 countries using Hofstede's framework. Visualize Power Distance, Individualism, Masculinity, Uncertainty Avoidance, Long-Term Orientation, and Indulgence." />
    <meta property="og:title" content="Hofstede Cultural Compass" />
    <meta property="og:description" content="Compare cultural dimensions across 42 countries" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hofstede.trinos.group/" />
    <meta property="og:image" content="https://hofstede.trinos.group/art/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://hofstede.trinos.group/art/og-image.jpg" />
    <meta name="theme-color" content="#0f172a" />
    <title>Hofstede Cultural Compass</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Hofstede Cultural Compass",
      "url": "https://hofstede.trinos.group/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "Interactive bilingual (Korean/English) comparison of cultural dimensions across 42 countries based on Geert Hofstede's framework and Huib Wursten's Mental Images clusters.",
      "inLanguage": ["ko", "en"],
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "creator": { "@type": "Organization", "name": "Trinos Research Lab" }
    }
    </script>
    <link rel="preload" as="image" href="./art/hero-aurora.webp" fetchpriority="high">
    <!-- Dark mode flash prevention — must run before any paint -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('hofstede-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <!-- Google Fonts: Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
