<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare cultural dimensions across 42 countries using Hofstede's framework. Visualize Power Distance, Individualism, Masculinity, Uncertainty Avoidance, Long-Term Orientation, and Indulgence." />
    <meta property="og:title" content="Hofstede Cultural Compass" />

    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <title>Hofstede Cultural Compass</title>
    <!-- Dark mode flash prevention — must run before any paint -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('hofstede-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <!-- Google Fonts: Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
